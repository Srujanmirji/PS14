<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#070B1A" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#glowGrad)" stroke-width="6" opacity="0.4" stroke-dasharray="12 12" />

  <!-- Protective Arch / Shield Shape -->
  <g filter="url(#softGlow)">
    <!-- Central Yojana Emblem / Stylized Seed of Opportunity -->
    <path d="M256 100 C270 180 370 200 370 290 C370 360 310 400 256 400 C202 400 142 360 142 290 C142 200 242 180 256 100 Z" fill="url(#primaryGrad)" />
    
    <!-- Inner Radiant Core -->
    <circle cx="256" cy="290" r="48" fill="#FFFFFF" opacity="0.95" />
    <circle cx="256" cy="290" r="32" fill="#070B1A" />
    <circle cx="256" cy="290" r="16" fill="#F59E0B" />

    <!-- Uplifting Hands / Leaf Arcs -->
    <path d="M160 310 C180 370 220 380 256 380" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.8" />
    <path d="M352 310 C332 370 292 380 256 380" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.8" />
  </g>
</svg>
